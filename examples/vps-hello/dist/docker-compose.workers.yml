# Generated by vibed-infra package
networks:
  edge:
    external: true
    name: ${DOCKER_NETWORK:-vps-edge}

services:
  worker:
    image: ${WORKER_IMAGE:-hello-vps-worker:local}
    container_name: ${WORKER_CONTAINER_NAME:-hello-vps-worker}
    restart: unless-stopped
    mem_limit: ${WORKER_MEMORY_LIMIT:-64m}
    env_file: .env
    environment:
      WORKER_ROLE: ${WORKER_ROLE:-heartbeat}
      WORKER_CONFIG: /config/workers.yaml
      API_URL: ${API_URL:-http://hello-vps-api:8080}
      INTERVAL_SEC: ${INTERVAL_SEC:-60}
    volumes:
      - ./logs:/data/logs
      - ./nodes-workers.yaml:/config/workers.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - edge

name: hello-vps
version: 1

templates:
  api: api-config.yaml
  ui: ui-config.yaml
  nodes: nodes-config.yaml

network:
  edge: vps-edge

autoUpdate:
  api:
    enabled: false
    intervalMin: 30
    offset: 0
  ui:
    enabled: false
    intervalMin: 20
    offset: 15
  nodes:
    enabled: false
    intervalMin: 30
    offset: 10
  gateway:
    enabled: false
    intervalMin: 20
    offset: 20

gateway:
  # Documentation / TEST-NET sample IP — replace with your VPS IPv4 before packaging for production
  publicIp: 203.0.113.10
  tlsEmail: ops@example.com
  nginxImage: nginx:alpine
  sites:
    - host: hello.example.com
      aliases:
        - www.hello.example.com
      healthPath: /api/health
      createPath: /api/notes
      tlsCertDir: ./certs


# Generic backend service (optional compose path).
# Most products use profile start script (docker run + named volumes) for remote Docker compatibility.
#
# Usage: docker compose --env-file .env -f docker-compose.backend.yml up -d

volumes:
  api_data:
    external: true
    name: ${DATA_VOLUME:-${DOCKER_NAME:-backend}-data}
  api_persist:
    external: true
    name: ${PERSIST_LOG_VOLUME:-${DOCKER_NAME:-backend}-persist}

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/example/backend:main}
    container_name: ${DOCKER_NAME:-backend}
    restart: ${RESTART:-unless-stopped}
    mem_limit: ${BACKEND_MEMORY_LIMIT:-384m}
    env_file: .env
    labels:
      vibed.managed: "1"
      vibed.role: api
      vibed.data-volume: ${DATA_VOLUME:-${DOCKER_NAME:-backend}-data}
      vibed.persist-volume: ${PERSIST_LOG_VOLUME:-${DOCKER_NAME:-backend}-persist}
    environment:
      CONFIG_PATH: /config/server.yaml
      DB_PATH: /data/app.db
      PERSIST_LOG_DIR: /persist-logs
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - api_data:/data
      - api_persist:/persist-logs
      - ${CONFIG_FILE:-./app.yaml}:/config/server.yaml:ro
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  edge:
    name: ${DOCKER_NETWORK:-app-edge}
    external: false
